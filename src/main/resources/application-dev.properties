# 开发环境配置
server.port=9090

# 数据库配置
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/myappdb}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 日志级别 - 修改为更少的输出
logging.level.root=WARN
logging.level.com.example.demo=INFO
logging.level.org.springframework.web.socket=WARN
logging.level.org.springframework.messaging=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# 自定义日志格式，简化时间戳
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n

# 禁用 SQL 日志显示
spring.jpa.show-sql=true
# 禁用 Hibernate 的统计信息
spring.jpa.properties.hibernate.generate_statistics=false
# 减少 Hibernate 日志
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# 禁用 open-in-view 模式，避免相关警告
spring.jpa.open-in-view=false

# WebSocket配置
spring.websocket.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:y0vwxUQObLaJDMgaR3zsoCpRHoDLWlg763Vtm0rZ8zCAl6yh2DOaDQb1H9gbpSOG}
jwt.expiration=${JWT_EXPIRATION:86400}
//your_jwt_secret_key_should_be_at_least_256_bits_long_for_security

# ?? JMX
spring.jmx.enabled=true
spring.jmx.default-domain=com.example.demo

# CORS配置
app.cors.allowed-origins=http://localhost:5173

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false

# Redis配置（开发环境）
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=5000ms
# Redis连接池配置
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-wait=-1ms
spring.redis.lettuce.pool.max-idle=5
spring.redis.lettuce.pool.min-idle=0

# 缓存配置
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.key-prefix=game_config_
spring.cache.redis.use-key-prefix=true

